[platformio]
default_envs = esp32c3_supermini

[env]
platform = espressif32@6.12.0
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps = arduino-libraries/ArduinoMqttClient@0.1.8
build_flags = -DCORE_DEBUG_LEVEL=0

; Task-book baseline, classic ESP32 (not for C3 hardware).
[env:esp32dev]
board = esp32dev

; Purchased C3 SuperMini, advertised 4MB, native Type-C USB. Verify on arrival.
[env:esp32c3_supermini]
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
board_build.partitions = min_spiffs.csv
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
